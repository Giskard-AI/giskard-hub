name: Start a new release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to be created (e.g., 1.2.3 or 2.0.0b4)"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "Invalid version: '$VERSION'. Expected X.Y.Z optionally followed by letters/digits (e.g., 2.0.0b4)" >&2
            exit 1
          fi
      - name: Check if organization member
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if ! gh api "orgs/Giskard-AI/members/${ACTOR}" --silent 2>/dev/null; then
            echo "Job failed due to user not being a member of Giskard-AI organization" >&2
            exit 1
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          ref: main
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global user.name 'giskard-hub-release-bot[bot]'
          git config --global user.email '3192176+giskard-hub-release-bot[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/Giskard-AI/giskard-hub.git"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Change version
        run: |
          set -euo pipefail
          uv version "${VERSION}"

      - name: Build release candidate wheel
        run: uv build

      - name: Adding file
        run: |
          git add pyproject.toml uv.lock
          git fetch --quiet --tags
          git commit -m "v${VERSION}" --allow-empty
          git tag "v${VERSION}"

      - name: Push to main and tags
        run: |
          set -euo pipefail
          git push origin main
          git push origin "v${VERSION}"

      - name: Create Github Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --generate-notes \
            dist/giskard_hub-*.tar.gz \
            dist/giskard_hub-*.whl

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
